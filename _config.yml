# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Site language
lang: en

# Your timezone
timezone: Asia/Kolkata

# jekyll-seo-tag settings

title: Sreyank Bose
tagline: A personal blog for things I like sharing!

description: >-
  My personal website and blog.

# Your GitHub Pages URL
url: "https://sreyank-blog.github.io"

# Your GitHub username
github:
  username: Sreyank-Bose-Git

# Twitter/X username
# Leave empty if you don't use Twitter/X
twitter:
  username:

# Social information
social:
  name: Sreyank Bose
  email:
  fediverse_handle:

  links:
    - https://github.com/Sreyank-Bose-Git
    # Add other profiles here if you want:
    # - https://www.linkedin.com/in/yourusername
    # - https://www.instagram.com/yourusername


# Site Verification Settings
# Leave these empty until you actually verify the site.

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:


# Web Analytics Settings
# Leave these empty unless you configure an analytics service.

analytics:
  google:
    id:

  goatcounter:
    id:

  umami:
    id:
    domain:

  matomo:
    id:
    domain:

  cloudflare:
    id:

  fathom:
    id:


# Page views settings
# Currently supports: goatcounter
pageviews:
  provider:


# Theme mode
#
# Empty = automatically follows the user's system preference
# light = always light
# dark = always dark

theme_mode:


# CDN endpoint
cdn:


# Sidebar avatar
# Example:
# avatar: "/assets/img/avatar.jpg"

avatar:


# Social preview image
# Example:
# social_preview_image: "/assets/img/preview.png"

social_preview_image:


# Table of Contents
toc: true


# Post actions
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false


# Comments
comments:
  # Supported:
  # disqus
  # utterances
  # giscus
  #
  # Leave empty to disable comments globally.
  provider:

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: en
    reactions_enabled: 1


# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:


# Progressive Web App
pwa:
  enabled: true

  cache:
    enabled: true

    deny_paths:
      # - "/example"


# Number of posts per page
paginate: 10


# Base URL
#
# For:
# https://username.github.io
#
# this MUST be empty.

baseurl: ""


# ------------ The following options are not recommended to be modified ------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge

  syntax_highlighter_opts:
    css_class: highlight

    span:
      line_numbers: false

    block:
      line_numbers: true
      start_line: 1


# Tabs collection
collections:
  tabs:
    output: true
    sort_by: order


# Default layouts
defaults:

  # Blog posts
  - scope:
      path: ""
      type: posts

    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/


  # Drafts
  - scope:
      path: _drafts

    values:
      comments: false


  # Tabs
  - scope:
      path: ""
      type: tabs

    values:
      layout: page
      permalink: /:title/


# Sass
sass:
  style: compressed


# HTML compression
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false

  ignore:
    envs:
      - development


# Files excluded from the generated site
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"


# Jekyll Archives
jekyll-archives:
  enabled:
    - categories
    - tags

  layouts:
    category: category
    tag: tag

  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
